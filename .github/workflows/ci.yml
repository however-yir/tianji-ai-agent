name: tianji-ai-agent CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-business-path:
    name: Core Business Path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/chat-ui/package-lock.json

      - name: Frontend lint, test, build
        working-directory: web/chat-ui
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:run
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Python smoke tests
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest -q tests

      - name: Internal docs link check
        run: python3 scripts/check_internal_links.py

      - name: Offline route regression gate
        run: |
          set -euo pipefail
          python3 scripts/evaluation/evaluate_route_agent.py --output-dir artifacts/evaluation

      - name: Golden run replay
        run: |
          set -euo pipefail
          python3 scripts/replay_agent_run.py

      - name: Agent release manifest (validate + generate)
        run: |
          set -euo pipefail
          python3 scripts/generate_agent_manifest.py --verify
          python3 scripts/generate_agent_manifest.py --output-dir artifacts/manifest \
            --metrics artifacts/evaluation/agent-eval-report.json

      - name: Enterprise launch readiness
        run: bash scripts/validate_enterprise_launch.sh

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install tj-aigc dependency chain
        run: mvn -B -ntp -f src/tjxt/pom.xml -pl tj-aigc -am -DskipTests install

      - name: Run tj-aigc tests and core coverage gate
        run: mvn -B -ntp -f src/tjxt/tj-aigc/pom.xml verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: src/tjxt/tj-aigc/target/site/jacoco/

      - name: Upload route evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: route-evaluation
          path: artifacts/evaluation/

      - name: Upload agent release manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-release-manifest
          path: artifacts/manifest/

      - name: Compile Spring AI sample
        run: mvn -B -ntp -f src/my-spring-ai/pom.xml -DskipTests package

      - name: Compile OpenAI Java sample
        run: mvn -B -ntp -f src/openai-java-demo/pom.xml -DskipTests package

  agent-acceptance-gate:
    name: Agent Acceptance Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run one-click acceptance suite (no LLM required)
        run: |
          set -euo pipefail
          python3 scripts/run_acceptance.py --skip-frontend

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-report
          path: artifacts/acceptance/

  python-quality:
    name: Python Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Ruff check
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff==0.16.5
          ruff check tests scripts performance

      - name: Compile Python files
        run: |
          set -euo pipefail
          python -m compileall -q tests scripts

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  java-quality:
    name: Java Quality Gates (Checkstyle + SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install tj-aigc dependency chain
        run: mvn -B -ntp -f src/tjxt/pom.xml -pl tj-aigc -am -DskipTests install

      - name: Checkstyle
        run: mvn -B -ntp -f src/tjxt/tj-aigc/pom.xml checkstyle:check

      - name: SpotBugs
        run: mvn -B -ntp -f src/tjxt/tj-aigc/pom.xml spotbugs:check

  helm-chart:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v4.2.0'

      - name: Helm lint
        run: helm lint helm/tianji-ai-agent

      - name: Helm template (dev render)
        run: helm template tianji-prod helm/tianji-ai-agent >/tmp/tianji-rendered.yaml

  advisory-npm-audit:
    name: Advisory npm Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/chat-ui/package-lock.json

      - name: npm audit (advisory; registry feed volatile)
        continue-on-error: true
        working-directory: web/chat-ui
        run: npm audit --audit-level=high

  advisory-owasp-scan:
    name: Advisory OWASP Dependency Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: OWASP dependency check advisory
        continue-on-error: true
        run: mvn -B -ntp -f src/tjxt/tj-aigc/pom.xml org.owasp:dependency-check-maven:check

  advisory-image-scan:
    name: Advisory Container Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Trivy filesystem scan (tj-aigc Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'src/tjxt/tj-aigc'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy filesystem scan (chat-ui Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'web/chat-ui'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
