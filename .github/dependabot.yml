version: 2
updates:
  - package-ecosystem: maven
    directory: /src/tjxt
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java

  - package-ecosystem: npm
    directory: /web/chat-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
