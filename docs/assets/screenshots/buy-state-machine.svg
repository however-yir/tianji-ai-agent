    <text x="24" y="48" fill="#991B1B" font-family="SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">HANDOFF_OR_DONE</text>
    <text x="24" y="82" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="16">支付敏感 / 低置信度 / 投诉转人工</text>
  </g>
  <rect x="72" y="438" width="620" height="116" rx="12" fill="#FFFFFF" stroke="#D5E0F2"/>
  <text x="100" y="482" fill="#132A58" font-family="Arial, sans-serif" font-size="22" font-weight="700">SSE PARAM 订单卡字段</text>
  <text x="100" y="520" fill="#52617C" font-family="SFMono-Regular, Menlo, monospace" font-size="17">businessState: USER_CONFIRM_REQUIRED</text>
  <text x="100" y="552" fill="#52617C" font-family="SFMono-Regular, Menlo, monospace" font-size="17">stateTrace: COURSE_SELECTED -&gt; ORDER_PREVIEW -&gt; USER_CONFIRM_REQUIRED</text>
